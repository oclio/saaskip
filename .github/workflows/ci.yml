name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🔍 Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
      BETTER_AUTH_SECRET: dbNSbgAE0s8BhOp2nEzL4NTKWB48JAUU
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ov23_client_id_placeholder
      GITHUB_CLIENT_SECRET: github_client_secret_placeholder_value_32_chars
      GOOGLE_CLIENT_ID: 1234567890-google_client_id_placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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lder_value

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔍 Check (types, lint, knip)
        run: pnpm check:types && pnpm lint && pnpm knip

      - name: 📝 Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from origin/${{ github.base_ref }} --to HEAD

      - name: 📝 Markdown Lint
        run: pnpm exec markdownlint '**/*.md' --ignore **/node_modules/** --ignore **/.next/**

      - name: 🔤 Spell Check
        run: pnpm check:spell

      - name: 🧪 Unit Tests & Coverage
        run: pnpm test:coverage

      - name: 📤 Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 1

      - name: 🔒 Secrets Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dbNSbgAE0s8BhOp2nEzL4NTKWB48JAUU
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ov23_client_id_placeholder
      GITHUB_CLIENT_SECRET: github_client_secret_placeholder_value_32_chars
      GOOGLE_CLIENT_ID: 1234567890-google_client_id_placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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lder_value

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build
        run: pnpm build

      - name: 📤 Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: .next/
          retention-days: 1

  e2e:
    name: 🧪 E2E Tests
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
      BETTER_AUTH_SECRET: dbNSbgAE0s8BhOp2nEzL4NTKWB48JAUU
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ov23_client_id_placeholder
      GITHUB_CLIENT_SECRET: github_client_secret_placeholder_value_32_chars
      GOOGLE_CLIENT_ID: 1234567890-google_client_id_placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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lder_value

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🎭 Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: 🧪 E2E Tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5455/db
          RESEND_API_KEY: re_test_dummy_key_for_ci
          EMAIL_FROM: saaskip <noreply@saaskip.dev>

      - name: 📤 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: 📥 Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      - name: 🔄 Sync SonarQube exclusions
        run: node scripts/sonar-sync.mjs
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation:
    name: 🧬 Mutation
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'docs-only')) &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):'))
    env:
      HUSKY: 0
      BETTER_AUTH_SECRET: dbNSbgAE0s8BhOp2nEzL4NTKWB48JAUU
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ov23_client_id_placeholder
      GITHUB_CLIENT_SECRET: github_client_secret_placeholder_value_32_chars
      GOOGLE_CLIENT_ID: 1234567890-google_client_id_placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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lder_value

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📂 Restore Stryker Incremental Cache
        uses: actions/cache@v6
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          # PR branches can read main's cache; main can read its own previous cache
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-

      - name: 🧬 Mutation Testing
        run: pnpm stryker run --incremental
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: 📤 Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: reports/mutation/mutation.html
          retention-days: 7
